name: Enviar análises diárias por e-mail

on:
  schedule:
    # O horário do cron é em UTC!
    # Exemplo: 0 21 * * * = 21:00 UTC = 18:00 (horário de Brasília)
    - cron: '0 21 * * *'
  workflow_dispatch: # Permite rodar manualmente pela aba Actions para testar

jobs:
  executar-analises:
    runs-on: ubuntu-latest

    env:
      # Garante que date.today() no limpeza.py use o fuso do Brasil
      TZ: America/Sao_Paulo
      EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
      EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
      EMAIL_DESTINATARIOS: ${{ secrets.EMAIL_DESTINATARIOS }}

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar análises e enviar e-mail
        run: python main.py